# Optional libpostal-rest sidecar overlay.
#
# libpostal canonicalizes free-text addresses ("123 Main St" / "123 main
# street" / "123 N Main") into a single canonical form before the app
# computes the dedup hash. The data files are ~2 GB resident, so this is
# opt-in for self-hosted users who want stronger dedup on hand-entered
# addresses.
#
# Enable:
#   docker compose -f docker-compose.yml -f docker/docker-compose.libpostal.yml up -d
#
# When the sidecar is unreachable for any reason, the app gracefully
# falls back to the pass-through canonicalizer (same as if libpostal had
# never been enabled) — writes never fail because libpostal is down.

version: '3.8'

services:
  libpostal:
    # rezaq/libpostal-rest is a maintained fork of the original
    # johnlonganecker/libpostal-rest with the same /expand and /parser
    # contract that LibpostalRestCanonicalizer expects. The original
    # image was removed from Docker Hub.
    #
    # The image keeps its size small (~170 MB) by downloading the ~2 GB
    # libpostal model data to /data on first start. The named volume
    # below caches that data so subsequent restarts don't re-download.
    # First-time start can take 5-10 minutes on a fresh volume.
    image: rezaq/libpostal-rest:latest
    container_name: homemanagement-libpostal
    restart: unless-stopped
    volumes:
      - libpostal_data:/data
    expose:
      - "8080"
    healthcheck:
      # /parser is exposed by the app; the image doesn't ship a /health
      # endpoint, so probe a known-good /parser request as the liveness
      # signal. Generous start_period covers the first-run data download.
      test: ["CMD-SHELL", "wget -q -O - --post-data='{\"query\":\"1 main st\"}' --header='Content-Type: application/json' http://localhost:8080/parser || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    networks:
      - homemanagement-network
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  web:
    environment:
      - AddressCanonicalizer__Provider=Libpostal
      - Libpostal__BaseUrl=http://libpostal:8080
      - Libpostal__TimeoutSeconds=5
    depends_on:
      libpostal:
        condition: service_healthy

volumes:
  libpostal_data:
    # Caches the ~2 GB libpostal model data so it isn't re-downloaded on
    # every container restart.
