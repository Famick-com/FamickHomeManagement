# Overlay applied on top of docker-compose.yml when the operator chose
# "app-level TLS" at install time. Adds Kestrel HTTPS on top of the base HTTP
# listener (most self-hosters today put Caddy / Traefik / Tailscale Serve in
# front and don't need this — see docker-compose/README.md).
#
# Wired up by install-docker.sh writing COMPOSE_FILE into .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.app-tls.yml
#
# Docker compose reads COMPOSE_FILE from .env automatically, so plain
# `docker compose up -d` picks both files up without flags. Remove the
# COMPOSE_FILE line (or just delete this file) to switch back to HTTP-only.
#
# Cert is generated by setup.sh into data/certs/aspnetapp.pfx, which is
# already inside the base ./data:/app/data mount — no extra volume needed.

services:
  web:
    environment:
      - ASPNETCORE_URLS=http://+:80;https://+:443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/app/data/certs/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:-password}
    ports:
      - "${HTTPS_PORT:-4431}:443"
