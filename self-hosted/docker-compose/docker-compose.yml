services:
  postgres:
    image: postgres:16-alpine
    container_name: homemanagement-db
    environment:
      POSTGRES_DB: homemanagement
      POSTGRES_USER: homemanagement
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homemanagement"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homemanagement-network

  # Single ./data:/app/data bind mount covers everything operator-mutable:
  #   data/config/server-config.json   server-level overlay (wizard + admin Server Settings)
  #   data/plugins/config.json         plugin enable/disable + API keys (admin Plugins page)
  #   data/keys/jwt-rsa.pem            JWT signing key (generated by setup.sh)
  #   data/uploads/                    user-uploaded files
  #   data/dataprotection/             ASP.NET Data Protection keys (antiforgery, cookies)
  #   data/certs/aspnetapp.pfx         TLS cert (only created when app-level TLS is on)
  web:
    image: mtherienfamick/homemanagement:latest
    container_name: homemanagement-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=homemanagement;Username=homemanagement;Password=${DB_PASSWORD:-changeme123}
      - FixedTenantId=${TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - SelfHosted__TenantId=${TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - SelfHosted__ApplicationName=Home Management
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-your-secret-key-change-this-min-32-characters-long}
      - JwtSettings__RsaPrivateKeyPemFile=/app/data/keys/jwt-rsa.pem
      - JwtSettings__Issuer=https://localhost
      - JwtSettings__Audience=https://localhost
      - JwtSettings__AccessTokenExpirationMinutes=15
      - JwtSettings__RefreshTokenExpirationDays=7
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - homemanagement-network

  # Single-instance scheduler: runs supercronic against /app/scheduler-crontab and
  # invokes the web image's `run-job <name>` mode on each cron tick. Same image as
  # `web`; only the command differs. Distributed-lock idempotency lets jobs survive
  # an accidental double-run (e.g. operator runs one manually).
  scheduler:
    image: mtherienfamick/homemanagement:latest
    container_name: homemanagement-scheduler
    command: ["supercronic", "/app/scheduler-crontab"]
    # The image's HEALTHCHECK pings http://localhost:80/health (the web app);
    # supercronic doesn't bind that port, so the check would always fail and
    # Portainer / docker stats would mark the container unhealthy. The
    # scheduler's liveness is "supercronic process is alive" — Docker's
    # built-in process supervision covers that.
    healthcheck:
      disable: true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=homemanagement;Username=homemanagement;Password=${DB_PASSWORD:-changeme123}
      - FixedTenantId=${TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - SelfHosted__TenantId=${TENANT_ID:-00000000-0000-0000-0000-000000000001}
      - SelfHosted__ApplicationName=Home Management
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-your-secret-key-change-this-min-32-characters-long}
      - JwtSettings__RsaPrivateKeyPemFile=/app/data/keys/jwt-rsa.pem
      - JwtSettings__Issuer=https://localhost
      - JwtSettings__Audience=https://localhost
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - homemanagement-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: homemanagement-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - homemanagement-network
    profiles:
      - tools

networks:
  homemanagement-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
