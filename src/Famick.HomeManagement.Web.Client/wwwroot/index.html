<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Management</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="_content/Famick.HomeManagement.UI/images/icon.svg" />

    <!-- MudBlazor CSS -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Syncfusion Blazor CSS (bootstrap5 to match MudBlazor look) -->
    <link href="_content/Syncfusion.Blazor.Themes/bootstrap5.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <link href="_content/Famick.HomeManagement.UI/css/app.css" rel="stylesheet" />
    <link href="Famick.HomeManagement.Web.Client.styles.css" rel="stylesheet" />

    <style>
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #518751;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-error {
            max-width: 400px;
            margin: 2rem;
            padding: 1rem;
            background: #ffebee;
            border-radius: 8px;
            color: #c62828;
            text-align: center;
        }
    </style>
    <!-- Must stay in <head>, and before the stylesheets that follow it are irrelevant to this:
         it paints the page background from the stored preference synchronously, before the
         browser's first paint. Moved further down the document it still runs, but only after a
         white frame has already been shown, which is the flash it exists to prevent. -->
    <script src="_content/Famick.HomeManagement.UI/js/theme.js"></script>

</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <img src="_content/Famick.HomeManagement.UI/images/logo-lockup.svg" alt="Famick Home Management" style="height: 80px; margin-bottom: 1.5rem;" />
            <div class="loading-spinner"></div>
            <p style="margin-top: 1rem; color: #666;">Loading application...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="loading-error" style="display: none;">
        An unhandled error has occurred.
        <a href="" class="reload" id="blazor-error-reload">Reload</a>
        <a href="" class="dismiss" id="blazor-error-dismiss">Dismiss</a>
    </div>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Syncfusion Blazor JS -->
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js"></script>

    <!-- Mobile detection utilities -->
    <script src="_content/Famick.HomeManagement.UI/js/mobileDetection.js"></script>
    <script src="_content/Famick.HomeManagement.UI/js/timeZone.js"></script>

    <!-- Passkey/WebAuthn utilities -->
    <script src="_content/Famick.HomeManagement.UI/js/passkey.js"></script>

    <!-- Barcode Scanner: html5-qrcode 2.3.8 from npm, served from here (Apache-2.0, see its LICENSE) -->
    <script src="_content/Famick.HomeManagement.UI/lib/html5-qrcode/html5-qrcode.min.js"></script>

    <!-- App JS utilities, including the error bar's handlers -->
    <script src="_content/Famick.HomeManagement.UI/js/app.js"></script>

    <!-- Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
