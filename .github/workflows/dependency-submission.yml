name: Dependency Submission (NuGet)

# Overrides GitHub's auto-generated "Automatic Dependency Submission (NuGet)"
# workflow. The auto-generated job iterates every project file and runs
# `dotnet restore`, which fails on src/Famick.HomeManagement.Mobile because
# its net10.0-android target requires the maui-android workload (NETSDK1147).
# This workflow installs the workload first, then submits the dependency
# graph. GitHub skips the auto-generated submission when a workflow
# submits dependencies for the same ecosystem.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  GITHUB_PACKAGES_SOURCE: 'https://nuget.pkg.github.com/Famick-com/index.json'

jobs:
  submit:
    name: Submit NuGet dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve GitHub Packages token
        id: github-packages-token
        env:
          GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          if [ -n "$GH_PACKAGES_READ_TOKEN" ]; then
            echo "value=$GH_PACKAGES_READ_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using GH_PACKAGES_READ_TOKEN for GitHub Packages restore."
          else
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "GH_PACKAGES_READ_TOKEN is not set; falling back to github.token."
          fi

      - name: Authenticate GitHub Packages NuGet feed
        run: |
          dotnet nuget remove source github-famick --configfile NuGet.config || true
          dotnet nuget add source "${{ env.GITHUB_PACKAGES_SOURCE }}" \
            -n github-famick \
            --configfile NuGet.config \
            --username Famick-com \
            --password "${{ steps.github-packages-token.outputs.value }}" \
            --store-password-in-clear-text

      - name: Install MAUI workloads
        # On Linux the Mobile csproj drops net10.0-ios via
        # IsOSPlatform('linux'), so only maui-android is required here.
        # Pinned via workloads-rollback.json to match play-store.yml /
        # testflight.yml.
        run: dotnet workload install maui-android --from-rollback-file workloads-rollback.json

      - name: Submit dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@v0
