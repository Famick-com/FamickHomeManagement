name: Dependency Submission (NuGet)

# Overrides GitHub's auto-generated "Automatic Dependency Submission (NuGet)"
# workflow. GitHub skips its own submission when a workflow submits
# dependencies for the same ecosystem.
#
# This originally existed because the auto-generated job restored every project
# and choked on the MAUI app (NETSDK1147, no maui-android workload). The app now
# lives in Famick-com/famick-mobile and that reason is gone -- but the file is
# still needed, for a different one. Famick.HomeManagement.Core pulls
# Famick.HomeManagement.Plugin.Abstractions from the github-famick feed, and the
# auto-generated job has no way to authenticate against it. Deleting this file
# would hand submission back to a job that cannot restore the solution.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  GITHUB_PACKAGES_SOURCE: 'https://nuget.pkg.github.com/Famick-com/index.json'

jobs:
  submit:
    name: Submit NuGet dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve GitHub Packages token
        id: github-packages-token
        env:
          GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          if [ -n "$GH_PACKAGES_READ_TOKEN" ]; then
            echo "value=$GH_PACKAGES_READ_TOKEN" >> "$GITHUB_OUTPUT"
            echo "Using GH_PACKAGES_READ_TOKEN for GitHub Packages restore."
          else
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "GH_PACKAGES_READ_TOKEN is not set; falling back to github.token."
          fi

      - name: Authenticate GitHub Packages NuGet feed
        run: |
          dotnet nuget remove source github-famick --configfile NuGet.config || true
          dotnet nuget add source "${{ env.GITHUB_PACKAGES_SOURCE }}" \
            -n github-famick \
            --configfile NuGet.config \
            --username Famick-com \
            --password "${{ steps.github-packages-token.outputs.value }}" \
            --store-password-in-clear-text

      - name: Restore solution
        # The component-detection action reads obj/project.assets.json to
        # discover transitive NuGet dependencies — it does not run restore
        # itself. Without this, the action submits an empty manifest.
        run: dotnet restore Famick.sln

      - name: Submit dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@b876b8cc341a53970394b33ea0ca4e86c25542de # v0.1.3
