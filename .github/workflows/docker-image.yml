name: Publish Docker Image

# Builds the self-hosted multi-arch image (linux/amd64 + linux/arm64) and
# pushes to Docker Hub on every git tag matching v*. Mirrors the behavior of
# self-hosted/docker-compose/publish-dockerhub.sh: the image is tagged with
# the version (without the leading v) and also moves :latest to point at it
# -- including for prereleases -- so the install one-liner stays valid for
# whatever was last published.
#
# Required repository secrets:
#   DOCKERHUB_TOKEN -- a Docker Hub Personal Access Token with read/write on
#                     the mtherienfamick/homemanagement repository.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. 1.2.3 or 1.2.3-beta.1). Required for manual runs.'
        required: true
        type: string

env:
  DOCKERHUB_USER: mtherienfamick
  DOCKERHUB_REPO: mtherienfamick/homemanagement
  DOCKERFILE: self-hosted/docker-compose/Dockerfile
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    # arm64 builds run under qemu emulation on an amd64 runner; .NET workloads
    # under emulation are slow, so the 60-minute default is too tight.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::Could not determine version: not a v* tag push and no manual input"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $DOCKERHUB_REPO:$VERSION (+ :latest)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          # `:latest` always points at whatever was last pushed -- prereleases
          # included. Chosen deliberately so the install one-liner works
          # against any tagged build (matches publish-dockerhub.sh).
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_REPO }}:latest
          # GitHub Actions cache cuts subsequent runs from ~60min to ~15min
          # by reusing the dotnet restore + apt layers between tag pushes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published $DOCKERHUB_REPO" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.version.outputs.version }}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: \`${{ env.PLATFORMS }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hub: https://hub.docker.com/r/$DOCKERHUB_REPO/tags" >> "$GITHUB_STEP_SUMMARY"
